[package]
name = "anvil_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
urlencoding = "2.1.3"

[profile.dev]
incremental = true