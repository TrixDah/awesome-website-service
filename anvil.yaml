allow_embedding: false
db_schema:
  messages:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: Sender
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: MessageText
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: TimeSent
      type: datetime
    indexes: []
    server: full
    title: Messages
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: Username
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: Password
      type: string
    indexes: []
    server: full
    title: Users
metadata: {title: Educational Enrichment Strategies}
name: Awesome Messaging Site
package_name: Awesome_Messaging_Site
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: frmLogin, type: form}
startup_form: null
