allow_embedding: false
db_schema:
  chats:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: ChatName
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: Participants
      target: users
      type: link_multiple
    indexes: []
    server: full
    title: Chats
  messages:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: Sender
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: MessageText
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: TimeSent
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: false
      name: TargetChat
      target: chats
      type: link_single
    indexes: []
    server: full
    title: Messages
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: Username
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: Password
      type: string
    indexes: []
    server: full
    title: Users
metadata: {logo_img: 'asset:chatlogo_69e9a8f7b63de_vips_69e9a8f7c2ed2.jpg', title: Educational Enrichment Strategies}
name: Awesome Messaging Site
package_name: Awesome_Messaging_Site
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: frmLogin, type: form}
startup_form: null
