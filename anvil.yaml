allow_embedding: false
db_schema:
  chats:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: ChatName
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: Participants
      target: users
      type: link_multiple
    - admin_ui: {width: 200}
      client_hidden: false
      name: LastActivity
      type: datetime
    indexes: []
    server: full
    title: Chats
  messages:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: Sender
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: MessageText
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: TimeSent
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: false
      name: TargetChat
      target: chats
      type: link_single
    - admin_ui: {width: 200}
      client_hidden: false
      name: MessageImage
      type: media
    - admin_ui: {width: 200}
      client_hidden: false
      name: ReadBy
      target: users
      type: link_multiple
    indexes: []
    server: full
    title: Messages
  tokens:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: token
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: user
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: created_at
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: false
      name: lifetime
      type: number
    - admin_ui: {order: 4, width: 200}
      client_hidden: false
      name: revoked
      type: bool
    indexes: []
    server: full
    title: tokens
  users:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: Username
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: timeout_until
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: true
      name: remembered_logins
      type: simpleObject
    indexes: []
    server: full
    title: Users
metadata: {logo_img: 'asset:chatlogo_69e9a8f7b63de_vips_69e9a8f7c2ed2.jpg', title: Educational Enrichment Strategies}
name: Awesome Website Service
package_name: Awesome_Website_Service
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
scheduled_tasks:
- job_id: TKQFZXRP
  task_name: scheduled_prune_messages
  time_spec:
    at: {minute: 0}
    every: hour
    n: 5
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: true, enable_automatically: false, remember_me_days: 30, use_email: false, use_google: true, use_token: false}
  server_config:
    email_content:
      confirm_address:
        html: |-
          <p>Thanks for registering your account with us. Please click the following link to confirm that this is your account:</p>
          <p>{{confirm_link}}</p>
          <p>Thanks,</p>
          <p>The team</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: frmLogin, type: form}
startup_form: null
