container:
  properties:
    html: |-
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Terms of Service</title>

              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #ffffff;
                      color: #111111;
                      margin: 0;
                      padding: 40px 20px;
                  }

                  .container {
                      max-width: 850px;
                      margin: auto;
                  }

                  h1 {
                      font-size: 2.5rem;
                      margin-bottom: 10px;
                      border-bottom: 2px solid #e5e5e5;
                      padding-bottom: 10px;
                  }

                  h2 {
                      margin-top: 40px;
                      font-size: 1.4rem;
                  }

                  p {
                      line-height: 1.7;
                      color: #333333;
                  }

                  ul {
                      padding-left: 20px;
                      line-height: 1.7;
                      color: #333333;
                  }

                  li {
                      margin-bottom: 10px;
                  }

                  .notice {
                      background: #f5f5f5;
                      border-left: 4px solid #111111;
                      padding: 15px;
                      margin: 25px 0;
                  }

                  hr {
                      border: none;
                      border-top: 1px solid #e5e5e5;
                      margin: 35px 0;
                  }

                  .button-container {
                      margin-top: 50px;
                      display: flex;
                      gap: 15px;
                  }

                  button {
                      padding: 12px 24px;
                      border: none;
                      border-radius: 8px;
                      font-size: 15px;
                      cursor: pointer;
                      transition: 0.2s ease;
                  }

                  .accept-btn {
                      background: #111111;
                      color: white;
                  }

                  .accept-btn:hover {
                      opacity: 0.9;
                  }

                  .decline-btn {
                      background: #f3f3f3;
                      color: #111111;
                      border: 1px solid #dddddd;
                  }

                  .decline-btn:hover {
                      background: #ebebeb;
                  }
              </style>
          </head>
          <body>

              <div class="container">

                  <h1>Terms of Service</h1>

                  <p>
                      This service is hosted on Anvil and managed by St Bede’s College ("the Service").
                      By accessing or using this Service, you agree to comply with these Terms of Service.
                      Failure to comply may result in suspension, permanent bans, reporting to St Bede’s College,
                      or referral to relevant authorities where applicable.
                  </p>

                  <div class="notice">
                      Administrators reserve the sole and final right to determine whether any content or behaviour violates these Terms.
                  </div>

                  <h2>1. Definitions</h2>

                  <p>
                      A <strong>Message</strong> refers to any packet of information sent by a user to the server.
                  </p>

                  <ul>
                      <li><strong>Text-Based Messages</strong> — readable text content.</li>
                      <li><strong>Media-Based Messages</strong> — images, videos, audio, documents, or other uploaded files.</li>
                  </ul>

                  <hr>

                  <h2>2. Rules for Text-Based Messages</h2>

                  <p>Users must not send messages that:</p>

                  <ul>
                      <li>Harass, threaten, bully, or attack another user.</li>
                      <li>Contain hate speech, discrimination, or targeted abuse.</li>
                      <li>Contain excessive or disruptive profanity.</li>
                      <li>Promote illegal, explicit, or harmful topics.</li>
                      <li>Encourage violence, self-harm, or dangerous behaviour.</li>
                      <li>Contain spam, scams, malicious links, or misleading information.</li>
                  </ul>

                  <p>
                      Mild profanity may be permitted when used in a non-targeted and non-abusive manner,
                      as determined by the administrators.
                  </p>

                  <hr>

                  <h2>3. Rules for Media-Based Messages</h2>

                  <p>Media-based messages must not contain:</p>

                  <ul>
                      <li>Explicit or NSFW content.</li>
                      <li>Violent, graphic, or disturbing material.</li>
                      <li>Harassment, hate speech, or discriminatory content.</li>
                      <li>Illegal or harmful material.</li>
                      <li>Malware, malicious files, or harmful software.</li>
                  </ul>

                  <p>
                      Any media deemed inappropriate may be removed without notice.
                  </p>

                  <hr>

                  <h2>4. Enforcement</h2>

                  <p>Violations may result in:</p>

                  <ul>
                      <li>Content removal</li>
                      <li>Temporary suspension</li>
                      <li>Permanent bans</li>
                      <li>Reporting to St Bede’s College administration</li>
                      <li>Referral to law enforcement where necessary</li>
                  </ul>

                  <p>
                      All enforcement decisions are made at the discretion of the administrators.
                  </p>

                  <hr>

                  <h2>5. User Responsibility</h2>

                  <p>
                      Users are solely responsible for the content they send through the Service.
                      Attempting to bypass moderation, exploit vulnerabilities, or interfere with
                      the operation of the Service is strictly prohibited.
                  </p>

                  <hr>

                  <h2>6. Changes to These Terms</h2>

                  <p>
                      These Terms may be updated or modified at any time without prior notice.
                      Continued use of the Service constitutes acceptance of the latest version
                      of these Terms.
                  </p>

                  <!-- Anvil Compatible Buttons -->
                  <div class="button-container">
                      <button class="accept-btn" onclick="window.accept_tos()">
                          Accept
                      </button>

                      <button class="decline-btn" onclick="window.decline_tos()">
                          Decline
                      </button>
                  </div>

              </div>

          </body>
      </html>
  type: HtmlTemplate
is_package: true
