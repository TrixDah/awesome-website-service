components: []
container:
  properties:
    html: |-
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Terms of Service</title>

              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #ffffff;
                      color: #111111;
                      margin: 0;
                      padding: 40px 20px;
                  }

                  .container {
                      max-width: 850px;
                      margin: auto;
                  }

                  h1 {
                      font-size: 2.5rem;
                      margin-bottom: 10px;
                      border-bottom: 2px solid #e5e5e5;
                      padding-bottom: 10px;
                  }

                  h2 {
                      margin-top: 40px;
                      font-size: 1.4rem;
                  }

                  p, ul {
                      line-height: 1.7;
                      color: #333;
                  }

                  li {
                      margin-bottom: 10px;
                  }

                  .notice {
                      background: #f5f5f5;
                      border-left: 4px solid #111;
                      padding: 15px;
                      margin: 25px 0;
                  }

                  .warning {
                      background: #fff4e5;
                      border-left: 4px solid #ff9800;
                      padding: 15px;
                      margin: 25px 0;
                  }

                  .warning {
                      background: #fff4e5;
                      border-left: 4px solid #ff9800;
                      padding: 15px;
                      margin: 25px 0;
                  }

                  hr {
                      border: none;
                      border-top: 1px solid #e5e5e5;
                      margin: 35px 0;
                  }

                  a {
                      color: #0066cc;
                  }

                  /* Checkbox agreement box */
                  .agree-box {
                      margin-top: 40px;
                      padding: 20px;
                      border: 1px solid #dddddd;
                      border-radius: 8px;
                      background: #fafafa;
                  }

                  .agree-box button {
                      margin-top: 15px;
                      padding: 12px 24px;
                      border: none;
                      border-radius: 8px;
                      font-size: 15px;
                      cursor: pointer;
                      background: #111111;
                      color: white;
                      opacity: 0.5;
                  }

                  .agree-box button.enabled {
                      opacity: 1;
                  }

                  .agree-box button:hover:enabled {
                      opacity: 0.9;
                  }
              </style>
          </head>

          <body>

              <body>
                  <div class="container">

                      <h1>Terms of Service</h1>

                      <p>
                          This service is hosted on Anvil and managed by St Bede’s College ("the Service").
                          By accessing or using this Service, you agree to comply with these Terms of Service,
                          the St Bede’s College ICT Acceptable Use Policy, and all applicable rules.
                      </p>

                      <div class="notice">
                          By using this application, you agree to the
                          <a href="https://www.stbedes.catholic.edu.au/ict-policies/" target="_blank">
                              St Bede’s College ICT Acceptable Use Policy
                          </a>.
                      </div>

                      <div class="warning">
                          Misuse may result in suspension, bans, disciplinary action, or escalation to authorities where applicable.
                      </div>

                      <hr>

                      <h2>1. Definitions</h2>
                      <p>A <strong>Message</strong> refers to any data sent to the server.</p>

                      <ul>
                          <li><strong>Text-Based Messages</strong> — readable text content.</li>
                          <li><strong>Media-Based Messages</strong> — images, videos, audio, documents, or files.</li>
                      </ul>

                      <hr>

                      <h2>2. Privacy & Data Collection</h2>
                      <ul>
                          <li>User identifiers and emails</li>
                          <li>Messages and uploaded media</li>
                          <li>Activity timestamps</li>
                          <li>Reports and moderation logs</li>
                      </ul>

                      <p>
                          Content may be reviewed by authorised staff for safety and moderation purposes.
                      </p>

                      <hr>

                      <h2>3. Rules for Messages</h2>
                      
                      <ul>
                          <li>No harassment, threats, bullying, or abuse</li>
                          <li>No hate speech or discrimination</li>
                          <li>No illegal or harmful content</li>
                          <li>No spam, scams, or malicious links</li>
                      </ul>

                      <hr>

                      <h2>4. Media Rules</h2>

                      <ul>
                          <li>No explicit or NSFW content</li>
                          <li>No violent or disturbing material</li>
                          <li>No illegal or harmful files</li>
                          <li>No malware or malicious uploads</li>
                      </ul>

                      <hr>

                      <h2>5. Enforcement</h2>

                      <ul>
                          <li>Content removal</li>
                          <li>Temporary suspension</li>
                          <li>Permanent bans</li>
                          <li>Escalation to school or authorities</li>
                      </ul>

                      <h2>6. User Responsibility</h2>

                      <p>
                          Users are responsible for all activity on their account.
                          Bypassing moderation or interfering with the system is prohibited.
                      </p>
  
                      <h2>7. Changes</h2>

                      <p>
                          Terms may change at any time. Continued use means acceptance.
                      </p>

                      <hr>
                      <div class="agree-box">

                          <label>
                              <input type="checkbox" id="agreeCheckbox">
                              I agree to the Terms of Service and ICT Acceptable Use Policy.
                          </label>

                          <br>

                          <button id="agreeButton" onclick="window.accept_tos()" disabled>
                              I Agree
                          </button>

                          <button style="decline" onclick="window.decline_tos()">
                              I Decline
                          </button>

                      </div>

                  </div>

                  <script>
                      const checkbox = document.getElementById("agreeCheckbox");
                      const button = document.getElementById("agreeButton");

                      checkbox.addEventListener("change", () => {
                          button.disabled = !checkbox.checked;
                          button.classList.toggle("enabled", checkbox.checked);
                      });
                  </script>

              </body>
      </html>
  type: HtmlTemplate
is_package: true
