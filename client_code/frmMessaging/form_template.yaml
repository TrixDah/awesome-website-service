components:
- layout_properties: {grid_position: 'SVGXQX,BVDIEY'}
  name: lblTitle
  properties: {align: center, font_size: 30, text: 'Awesome Website Service™ '}
  type: Label
- layout_properties: {grid_position: 'HCDKNL,MGOBHS'}
  name: spacer_1
  properties: {height: 44}
  type: Spacer
- components:
  - layout_properties: {grid_position: 'VDEJEZ,RQVVJT'}
    name: lblWelcome
    properties: {align: center, text: 'Messages:'}
    type: Label
  layout_properties: {grid_position: 'HCDKNL,YPHYBE'}
  name: column_panel_1
  properties: {}
  type: ColumnPanel
- components:
  - layout_properties: {grid_position: 'JKHWFN,MFDMIX'}
    name: btnCreateChat
    properties: {text: Start Chat}
    type: Button
  layout_properties: {grid_position: 'HCDKNL,PJVEID'}
  name: column_panel_3
  properties: {}
  type: ColumnPanel
- components:
  - data_bindings: []
    layout_properties: {grid_position: 'UYPELR,FAQAKH'}
    name: drpNewUserSelect
    properties:
      include_placeholder: true
      items: [adam]
      placeholder: Select a user...
      tooltip: ''
    type: DropDown
  - layout_properties: {grid_position: 'OVKAAE,KZIKUL'}
    name: rpChatList
    properties: {item_template: frmMessaging.ItemTemplate2}
    type: RepeatingPanel
  layout_properties: {grid_position: 'IGAPXR,GSQWEM'}
  name: pnlSidebar
  properties: {}
  type: ColumnPanel
- event_bindings: {}
  layout_properties: {grid_position: 'IGAPXR,BDBCTI'}
  name: timer_1
  properties: {interval: 2}
  type: Timer
- layout_properties: {grid_position: 'BQSKJL,IJNRMX'}
  name: rpMessages
  properties: {item_template: frmMessaging.ItemTemplate1}
  type: RepeatingPanel
- layout_properties: {grid_position: 'BQSKJL,IJNRMX'}
  name: lblNoMessages
  properties: {align: center, font_size: 14, italic: true, text: No messages yet. Be the first to say hello!}
  type: Label
  visible: false
- components:
  - event_bindings: {}
    layout_properties: {grid_position: 'LRGORS,EZCLHF'}
    name: txtNewMessage
    properties: {placeholder: 'Type your message here:'}
    type: TextBox
  layout_properties: {grid_position: 'YWEFLI,QLNJWH'}
  name: columnpanel22
  properties: {}
  type: ColumnPanel
- components:
  - event_bindings: {click: btnLogout_click}
    layout_properties: {grid_position: 'TFYVCI,IKNDTR'}
    name: btnLogout
    properties: {background: '', text: Logout}
    type: Button
  - layout_properties: {grid_position: 'TFYVCI,ERKXEO'}
    name: file_loader_1
    properties: {file_types: image/*, text: Upload Image}
    type: FileLoader
  - event_bindings: {}
    layout_properties: {grid_position: 'TFYVCI,ADYCAI'}
    name: btnRefresh
    properties: {text: 'Refresh '}
    type: Button
  - layout_properties: {grid_position: 'TFYVCI,TMYRRQ'}
    name: btnSend
    properties: {text: Send Message}
    type: Button
  - event_bindings: {click: btnSwitchChats_click}
    layout_properties: {grid_position: 'TFYVCI,ZHNBZI'}
    name: btnSwitchChats
    properties: {text: '< Back '}
    type: Button
  layout_properties: {grid_position: 'HDBPMA,ZPLZHD KDPAKY,RKJSSZ'}
  name: column_panel_2
  properties: {col_widths: '{"ADYCAI":20,"ZHNBZI":20}'}
  type: ColumnPanel
- components: []
  layout_properties: {grid_position: 'HDBPMA,ZPLZHD IAJBGH,ZIGLRF'}
  name: column_panel_6
  properties: {}
  type: ColumnPanel
container: {type: ColumnPanel}
is_package: true
