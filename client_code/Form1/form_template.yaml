      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Terms of Service</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #ffffff;
                      color: #111111;
                      margin: 0;
                      padding: 40px 20px;
                  }

                  .container {
                      max-width: 850px;
                      margin: auto;
                  }

                  h1 {
                      font-size: 2.5rem;
                      margin-bottom: 10px;
                      border-bottom: 2px solid #e5e5e5;
                      padding-bottom: 10px;
                  }

                  h2 {
                      margin-top: 40px;
                      font-size: 1.4rem;
                  }

                  p {
                      line-height: 1.7;
                      color: #333333;
                  }

                  ul {
                      padding-left: 20px;
                      line-height: 1.7;
                      color: #333333;
                  }

                  li {
                      margin-bottom: 10px;
                  }

                  .notice {
                      background: #f5f5f5;
                      border-left: 4px solid #111111;
                      padding: 15px;
                      margin: 25px 0;
                  }

                  hr {
                      border: none;
                      border-top: 1px solid #e5e5e5;
                      margin: 35px 0;
                  }
              </style>
